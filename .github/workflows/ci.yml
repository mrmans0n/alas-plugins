name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [sdk/alas-plugin, plugins/kanban, plugins/pixel-office]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.project }}/target
          key: cargo-${{ matrix.project }}-${{ hashFiles(format('{0}/Cargo.lock', matrix.project), 'rust-toolchain.toml') }}
      - name: Test
        working-directory: ${{ matrix.project }}
        run: cargo test --locked
      - name: Build wasm
        if: startsWith(matrix.project, 'plugins/')
        working-directory: ${{ matrix.project }}
        run: cargo build --locked --release --target wasm32-unknown-unknown
