name: Release

# Tag <plugin folder>-v<version>, e.g. kanban-v0.2.0. The version must match plugin.json.
on:
  push:
    tags: ["*-v*", "!sdk-v*"]

permissions:
  contents: write

concurrency:
  group: release-index
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve plugin
        id: plugin
        run: |
          tag="${GITHUB_REF_NAME}"
          folder="${tag%-v*}"
          version="${tag##*-v}"
          dir="plugins/$folder"
          manifest_version="$(jq -r .version "$dir/plugin.json")"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::tag says $version but $dir/plugin.json says $manifest_version"
            exit 1
          fi
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: |
          npm run build -w "${{ steps.plugin.outputs.dir }}"
          mkdir -p dist
          cp "${{ steps.plugin.outputs.dir }}/plugin.json" dist/plugin.json
          cp "${{ steps.plugin.outputs.dir }}/dist/plugin.js" dist/plugin.js
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/plugin.json dist/plugin.js --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update index.json
        run: |
          hash="$(scripts/trust-hash dist/plugin.json dist/plugin.js)"
          git fetch --quiet origin main
          git checkout --quiet -B main origin/main
          scripts/update-index.py "${{ steps.plugin.outputs.folder }}" "$GITHUB_REF_NAME" dist/plugin.json "$hash"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -am "chore(index): add $GITHUB_REF_NAME"
          git push origin HEAD:main
